# Clinica Arte Dentaria - API SEGURA (versao corrigida), porta 8082
# (8081 estava ocupada pelo contentor mongo-express)
server.port=8082

# Mesma base PostgreSQL, mas num SCHEMA proprio ("seguro") para nao colidir
# com o backend vulneravel (que usa o schema public).
spring.datasource.url=jdbc:postgresql://localhost:5433/clinica
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=seguro

spring.flyway.enabled=true
spring.flyway.schemas=seguro
spring.flyway.default-schema=seguro

# Segredo para assinar os tokens. CORRETO: vir de variavel de ambiente / cofre.
app.jwt.segredo=${JWT_SEGREDO:troca-este-segredo-em-producao-0123456789}
app.cors.origem=http://localhost:3000
