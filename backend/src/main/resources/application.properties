# Laboratorio - Clinica Arte Dentaria (API vulneravel para ensino)
server.port=8080

# Base de dados PostgreSQL (porta 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/clinica
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# O esquema e gerido pelas migrations Flyway (src/main/resources/db/migration).
# O Hibernate apenas valida que as entidades batem certo com as tabelas.
spring.jpa.hibernate.ddl-auto=validate

# Flyway corre as migrations no arranque
spring.flyway.enabled=true
